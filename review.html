<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B111E">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F6FB">
<title>مراجعة اليوم — R3D Daily Review</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700&family=Readex+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('r3d-daily-state-v1') || '{}');
      var theme = s.theme || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="./daily.css?v=8">
</head>
<body>
<div id="app"></div>

<script src="daily-data.js?v=7"></script>
<script src="audio-manifest.js?v=3"></script>
<script src="config.js?v=4"></script>
<script src="scenes.js?v=8"></script>
<script src="daily.js?v=8"></script>
<script>
  // Legacy entry point redirect: review.html?cat=greetings -> #/study/greetings
  (function () {
    var q = location.search.slice(1).split('&');
    var cat = 'all';
    for (var i = 0; i < q.length; i++) {
      var p = q[i], j = p.indexOf('=');
      if (j > 0 && p.slice(0, j) === 'cat') cat = decodeURIComponent(p.slice(j + 1));
    }
    if (!location.hash) location.replace('#/study/' + cat);
  })();

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
